<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Door Shop</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* ── Reset ── */
        *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
        html, body { height:100%; overflow:hidden; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }
        button { font-family:inherit; cursor:pointer; border:none; outline:none; }
        input, textarea { font-family:inherit; outline:none; border:none; }
        a { color:inherit; text-decoration:none; }
        svg { display:block; flex-shrink:0; }

        /* ── Color Tokens (navy default) ── */
        :root {
            --primary: #4f6ef7;
            --primary-dark: #3a56e4;
            --secondary: #2dd4bf;
            --green: #10b981;
            --red: #f43f5e;
            --bg: radial-gradient(ellipse at top left, #121c38, #050811);
            --text: #eef2ff;
            --text-2: #94a3b8;
            --text-3: #475569;
            --glass: rgba(255,255,255,0.05);
            --glass-border: rgba(255,255,255,0.09);
            --radius: 20px;
            --radius-sm: 12px;
            --sidebar-w: 240px;
            --topbar-h: 60px;
            --bottom-nav-h: 60px;
        }

        /* ── Background Orbs ── */
        .bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            z-index: 0;
            opacity: 0.15;
        }
        .bg-orb-1 { width:50vw; height:50vw; min-width:300px; background:var(--primary); top:-10%; left:-10%; animation:float1 20s ease-in-out infinite; }
        .bg-orb-2 { width:40vw; height:40vw; min-width:250px; background:var(--secondary); bottom:0; right:-10%; animation:float2 25s ease-in-out infinite; }
        .bg-orb-3 { width:30vw; height:30vw; min-width:200px; background:var(--primary-dark); top:40%; left:50%; animation:float1 30s ease-in-out infinite reverse; }
        @keyframes float1 { 0%,100%{transform:translate(0,0) scale(1)} 33%{transform:translate(5%,-10%) scale(1.1)} 66%{transform:translate(-5%,5%) scale(0.9)} }
        @keyframes float2 { 0%,100%{transform:translate(0,0) scale(1)} 33%{transform:translate(-5%,10%) scale(1.2)} 66%{transform:translate(5%,-5%) scale(0.8)} }

        /* ── Top Progress Bar ── */
        #top-progress-bar {
            position:fixed; top:0; left:0; height:3px;
            background:linear-gradient(90deg, var(--primary), var(--secondary));
            z-index:9999; width:0;
            transition:width 0.2s ease, opacity 0.3s ease;
            opacity:0; pointer-events:none;
        }

        /* ── App Shell ── */
        .app-shell { display:flex; height:100vh; position:relative; z-index:1; }

        /* ── Sidebar (Desktop Only) ── */
        .sidebar {
            width: var(--sidebar-w);
            flex-shrink: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px 14px;
            border-right: 1px solid var(--glass-border);
            background: rgba(8,12,24,0.85);
            backdrop-filter: blur(20px);
            position: fixed; top:0; left:0; z-index:100;
        }
        .sidebar-logo { display:flex; align-items:center; gap:10px; padding:6px 10px; margin-bottom:20px; flex-shrink:0; }
        .logo-icon { width:34px; height:34px; background:linear-gradient(135deg,var(--primary),var(--secondary)); border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
        .logo-icon svg { width:18px; height:18px; color:white; }
        .logo-name { font-size:16px; font-weight:700; background:linear-gradient(135deg,var(--text),var(--text-2)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .sidebar-nav { flex:1; display:flex; flex-direction:column; gap:2px; overflow-y:auto; }
        .nav-item {
            display: flex; align-items:center; gap:12px;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            color: var(--text-2);
            font-size: 13px; font-weight:500;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
            flex-shrink:0;
        }
        .nav-item svg { width:18px; height:18px; flex-shrink:0; fill:currentColor; }
        .nav-item:hover { background:rgba(255,255,255,0.05); color:var(--text); }
        .nav-item.active { background:color-mix(in srgb, var(--primary) 15%, transparent); color:var(--text); }
        .nav-item.active svg { color:var(--primary); }
        .sidebar-footer { border-top:1px solid var(--glass-border); padding-top:12px; margin-top:4px; flex-shrink:0; }
        .sidebar-user { display:flex; align-items:center; gap:10px; padding:10px 14px; border-radius:var(--radius-sm); }
        .avatar { width:32px; height:32px; border-radius:50%; overflow:hidden; border:2px solid var(--primary); background:var(--primary); display:flex; align-items:center; justify-content:center; color:white; font-weight:600; font-size:12px; flex-shrink:0; }
        .user-name { font-size:12px; font-weight:600; color:var(--text); }
        .user-handle { font-size:10px; color:var(--text-3); }

        /* ── Main Area ── */
        .main-area { flex:1; display:flex; flex-direction:column; margin-left:var(--sidebar-w); height:100vh; overflow:hidden; }

        /* ── Topbar ── */
        .topbar {
            height: var(--topbar-h);
            display: flex; align-items:center; justify-content:space-between;
            padding: 0 20px;
            border-bottom: 1px solid var(--glass-border);
            background: rgba(8,12,24,0.6);
            backdrop-filter: blur(20px);
            flex-shrink:0;
            z-index:50;
        }
        .topbar-left { display:flex; align-items:center; gap:12px; }
        .topbar-page-title { font-size:14px; font-weight:600; color:var(--text-2); }
        .topbar-right { display:flex; align-items:center; gap:8px; }
        .refresh-btn {
            width:32px; height:32px; border-radius:50%;
            background:var(--glass); border:1px solid var(--glass-border);
            display:flex; align-items:center; justify-content:center;
            color:var(--text-2); transition:all 0.2s;
        }
        .refresh-btn:hover { background:color-mix(in srgb, var(--primary) 15%, transparent); color:var(--primary); transform:rotate(20deg); }
        .refresh-btn svg { width:14px; height:14px; fill:currentColor; }
        .theme-toggle {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 40px;
            padding: 4px 10px 4px 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            color: var(--text-2);
            font-weight: 500;
            font-size: 0.75rem;
            transition: all 0.2s ease;
            backdrop-filter: blur(4px);
        }
        .theme-toggle:hover { background:rgba(255,255,255,0.1); color:var(--text); transform:scale(1.02); }
        .theme-toggle svg { width:16px; height:16px; fill:currentColor; }

        /* ── Pages Wrapper ── */
        .pages-wrap { flex:1; overflow:hidden; padding:16px 20px 0; }
        .pages-inner { height:100%; max-width:100%; margin:0 auto; }
        .page { display:none; height:100%; }
        .page.active { display:block; animation:pageIn 0.25s ease; }
        @keyframes pageIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

        /* ── Glass Card ── */
        .card {
            background: var(--glass);
            backdrop-filter: blur(28px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 20px;
            height:100%;
            overflow:auto;
        }
        .card-blank {
            background: var(--glass);
            backdrop-filter: blur(28px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 40px 20px;
            text-align: center;
            color: var(--text-3);
            font-size: 14px;
            height:100%;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
        }

        /* ── Password Modal ── */
        .password-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            z-index: 999;
            display: none;
            justify-content: center;
            align-items: center;
        }
        .password-overlay.active {
            display: flex;
        }
        .password-box {
            background: var(--glass);
            backdrop-filter: blur(28px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 40px 32px;
            max-width: 400px;
            width: 90%;
            text-align: center;
        }
        .password-box h2 {
            color: var(--text);
            font-size: 22px;
            margin-bottom: 8px;
        }
        .password-box p {
            color: var(--text-2);
            font-size: 14px;
            margin-bottom: 20px;
        }
        .password-box input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-sm);
            background: rgba(0,0,0,0.3);
            color: var(--text);
            font-size: 16px;
            outline: none;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
            text-align: center;
            letter-spacing: 4px;
        }
        .password-box input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79,110,247,0.2);
        }
        .password-box input::placeholder {
            color: var(--text-3);
            letter-spacing: 0;
        }
        .password-box .error-msg {
            color: var(--red);
            font-size: 13px;
            margin-top: 10px;
            min-height: 20px;
        }
        .password-box .btn-row {
            display: flex;
            gap: 10px;
            margin-top: 16px;
            justify-content: center;
        }
        .password-box .btn-row .btn {
            padding: 10px 30px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            font-family: 'Inter', sans-serif;
        }
        .password-box .btn-row .btn-primary {
            background: var(--primary);
            color: white;
        }
        .password-box .btn-row .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
            box-shadow: 0 4px 20px rgba(79,110,247,0.4);
        }
        .password-box .btn-row .btn-ghost {
            background: var(--glass);
            color: var(--text-2);
            border: 1px solid var(--glass-border);
        }
        .password-box .btn-row .btn-ghost:hover {
            background: rgba(255,255,255,0.08);
            color: var(--text);
        }

        /* ── IFrame - AUTO FITS PAGE ── */
        .page-iframe {
            width: 100%;
            height: 100%;
            min-height: 100%;
            border: none;
            border-radius: var(--radius-sm);
            background: rgba(0,0,0,0.2);
            display:block;
        }

        /* ── Toast ── */
        #toast {
            position:fixed; bottom:100px; left:50%; transform:translateX(-50%);
            background:rgba(20,26,46,0.95); backdrop-filter:blur(20px);
            border:1px solid var(--glass-border); border-radius:12px;
            padding:10px 18px; font-size:13px; font-weight:500;
            z-index:300; white-space:nowrap;
            opacity:0; transition:opacity 0.2s, transform 0.2s;
            transform:translateX(-50%) translateY(10px);
            pointer-events:none;
        }
        #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
        #toast.success { border-color:rgba(16,185,129,0.4); color:var(--green); }
        #toast.error   { border-color:rgba(244,63,94,0.4);  color:var(--red); }
        #toast.info    { border-color:rgba(79,110,247,0.4);  color:var(--primary); }

        /* ── Bottom Navigation (mobile) ── */
        .bottom-nav {
            display: none;
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: rgba(8,12,24,0.9);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--glass-border);
            z-index: 100;
            padding: 6px 0 10px;
            height: var(--bottom-nav-h);
            flex-shrink:0;
        }
        .bottom-nav-inner {
            display: flex;
            justify-content: space-around;
            max-width: 500px;
            margin: 0 auto;
            height:100%;
            align-items:center;
        }
        .bnav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            padding: 4px 8px;
            color: var(--text-3);
            cursor: pointer;
            transition: color 0.15s;
            flex: 1;
            font-size: 9px;
            font-weight: 500;
            min-width: 40px;
        }
        .bnav-item svg { width:20px; height:20px; fill:currentColor; }
        .bnav-item.active { color:var(--primary); }

        /* ── Responsive ── */
        @media (max-width:767px) {
            .sidebar { display:none; }
            .main-area { margin-left:0; }
            .bottom-nav { display:block; }
            .topbar { padding:0 14px; height:54px; }
            .topbar-page-title { font-size:13px; }
            .pages-wrap { padding:12px 12px 0; }
            .pages-inner { max-width:100%; }
            .card { padding:14px; }
            .card-blank { padding:30px 16px; }
            .theme-toggle span { display:none; }
            .theme-toggle { padding:4px 10px; }
            .password-box { padding:30px 20px; }
        }
        @media (max-width:480px) {
            .pages-wrap { padding:8px 8px 0; }
            .bottom-nav { padding:4px 0 8px; height:56px; }
            .bnav-item { font-size:8px; padding:2px 4px; }
            .bnav-item svg { width:18px; height:18px; }
            .topbar { height:48px; }
        }
        @media (min-width:768px) {
            .bottom-nav { display:none; }
        }
    </style>
</head>
<body>

    <!-- Background Orbs -->
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
    <div class="bg-orb bg-orb-3"></div>

    <!-- Top Progress Bar -->
    <div id="top-progress-bar"></div>

    <!-- Toast -->
    <div id="toast"></div>

    <!-- Password Overlay -->
    <div class="password-overlay" id="passwordOverlay">
        <div class="password-box">
            <h2>🔒 Protected Page</h2>
            <p>Enter the password to access <strong>Foam Truput</strong></p>
            <input type="password" id="passwordInput" placeholder="Enter password..." autofocus>
            <div class="error-msg" id="passwordError"></div>
            <div class="btn-row">
                <button class="btn btn-ghost" onclick="closePasswordModal()">Cancel</button>
                <button class="btn btn-primary" onclick="checkPassword()">Unlock</button>
            </div>
        </div>
    </div>

    <!-- App Shell -->
    <div class="app-shell">

        <!-- Sidebar (Desktop Only) -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-logo">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/></svg>
                </div>
                <span class="logo-name">DoorShop</span>
            </div>

            <nav class="sidebar-nav">
                <div class="nav-item active" id="snav-home" onclick="navigate('home')">
                    <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                    Home
                </div>
                <div class="nav-item" id="snav-foam" onclick="navigate('foam')">
                    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/><path d="M12 6v6l4 2"/></svg>
                    Foam
                </div>
                <div class="nav-item" id="snav-gasket" onclick="navigate('gasket')">
                    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/><path d="M12 6v8l4 2"/></svg>
                    Gasket
                </div>
                <div class="nav-item" id="snav-calculator" onclick="navigate('calculator')">
                    <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zM7 10h2v7H7zm4-3h2v10h-2zm4 6h2v4h-2z"/><rect x="7" y="7" width="2" height="2" rx="0.5"/><rect x="11" y="7" width="2" height="2" rx="0.5"/><rect x="15" y="7" width="2" height="2" rx="0.5"/></svg>
                    Calculator
                </div>
                <div class="nav-item" id="snav-truput" onclick="openPasswordModal()">
                    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/><path d="M12 6v6l4 2"/></svg>
                    Truput
                </div>
                <div class="nav-item" id="snav-upload" onclick="navigate('upload')">
                    <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
                    Door Upload
                </div>
            </nav>

            <div class="sidebar-footer">
                <div class="sidebar-user">
                    <div class="avatar">DS</div>
                    <div>
                        <div class="user-name">Door Shop</div>
                        <div class="user-handle">@doorshop</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Area -->
        <div class="main-area">

            <!-- Topbar -->
            <header class="topbar">
                <div class="topbar-left">
                    <span class="topbar-page-title" id="page-title">Home</span>
                </div>
                <div class="topbar-right">
                    <button class="refresh-btn" onclick="refreshAll()" title="Refresh">
                        <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.958 7.958 0 0012 4C7.58 4 4.01 7.58 4.01 12S7.58 20 12 20c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
                    </button>
                    <div class="theme-toggle" id="themeToggle" title="Switch theme">
                        <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm0 18a8 8 0 110-16 8 8 0 010 16z"/><path d="M12 6v12a6 6 0 000-12z"/></svg>
                        <span id="themeLabel">navy</span>
                    </div>
                </div>
            </header>

            <!-- Pages -->
            <div class="pages-wrap">
                <div class="pages-inner">

                    <!-- HOME PAGE -->
                    <div class="page active" id="page-home">
                        <div class="card-blank">
                            <div style="font-size:48px; margin-bottom:16px;">🚪</div>
                            <div style="font-size:18px; font-weight:600; color:var(--text-2);">Welcome to Door Shop</div>
                            <div style="margin-top:8px; color:var(--text-3);">Select a page from the navigation</div>
                        </div>
                    </div>

                    <!-- FOAM PAGE -->
                    <div class="page" id="page-foam">
                        <div class="card" style="padding: 0; overflow: hidden; background: transparent; backdrop-filter: none; border: none; height:100%;">
                            <iframe src="foam.html" class="page-iframe" id="foamIframe" title="Foam Page"></iframe>
                        </div>
                    </div>

                    <!-- GASKET PAGE -->
                    <div class="page" id="page-gasket">
                        <div class="card" style="padding: 0; overflow: hidden; background: transparent; backdrop-filter: none; border: none; height:100%;">
                            <iframe src="gasket.html" class="page-iframe" id="gasketIframe" title="Gasket Page"></iframe>
                        </div>
                    </div>

                    <!-- CALCULATOR PAGE -->
                    <div class="page" id="page-calculator">
                        <div class="card" style="padding: 0; overflow: hidden; background: transparent; backdrop-filter: none; border: none; height:100%;">
                            <iframe src="calculator.html" class="page-iframe" id="calculatorIframe" title="Calculator Page"></iframe>
                        </div>
                    </div>

                    <!-- TRUPUT PAGE (Password Protected) -->
                    <div class="page" id="page-truput">
                        <div class="card" style="padding: 0; overflow: hidden; background: transparent; backdrop-filter: none; border: none; height:100%;">
                            <iframe src="foamtruput.html" class="page-iframe" id="truputIframe" title="Truput Page"></iframe>
                        </div>
                    </div>

                    <!-- UPLOAD PAGE (In Iframe) -->
                    <div class="page" id="page-upload">
                        <div class="card" style="padding: 0; overflow: hidden; background: transparent; backdrop-filter: none; border: none; height:100%;">
                            <iframe id="uploadIframe" class="page-iframe" title="Door Upload"></iframe>
                        </div>
                    </div>

                </div>
            </div>

        </div>
    </div>

    <!-- Bottom Navigation (Mobile) -->
    <nav class="bottom-nav">
        <div class="bottom-nav-inner">
            <div class="bnav-item active" id="bnav-home" onclick="navigate('home')">
                <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                <span>Home</span>
            </div>
            <div class="bnav-item" id="bnav-foam" onclick="navigate('foam')">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/><path d="M12 6v6l4 2"/></svg>
                <span>Foam</span>
            </div>
            <div class="bnav-item" id="bnav-gasket" onclick="navigate('gasket')">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/><path d="M12 6v8l4 2"/></svg>
                <span>Gasket</span>
            </div>
            <div class="bnav-item" id="bnav-calculator" onclick="navigate('calculator')">
                <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14z"/><path d="M7 10h2v7H7zm4-3h2v10h-2zm4 6h2v4h-2z"/></svg>
                <span>Calc</span>
            </div>
            <div class="bnav-item" id="bnav-truput" onclick="openPasswordModal()">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/><path d="M12 6v6l4 2"/></svg>
                <span>Truput</span>
            </div>
            <div class="bnav-item" id="bnav-upload" onclick="navigate('upload')">
                <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
                <span>Upload</span>
            </div>
        </div>
    </nav>

    <script>
        // ── Password Configuration ──
        const TRUPUT_PASSWORD = 'doorshop2024'; // ← CHANGE THIS PASSWORD!

        var passwordAttempts = 0;
        var maxAttempts = 3;

        // ── Open Password Modal ──
        function openPasswordModal() {
            document.getElementById('passwordOverlay').classList.add('active');
            document.getElementById('passwordInput').value = '';
            document.getElementById('passwordError').textContent = '';
            setTimeout(function() {
                document.getElementById('passwordInput').focus();
            }, 100);
        }

        // ── Close Password Modal ──
        function closePasswordModal() {
            document.getElementById('passwordOverlay').classList.remove('active');
            document.getElementById('passwordInput').value = '';
            document.getElementById('passwordError').textContent = '';
        }

        // ── Check Password ──
        function checkPassword() {
            var input = document.getElementById('passwordInput').value;
            var errorEl = document.getElementById('passwordError');

            if (input === TRUPUT_PASSWORD) {
                closePasswordModal();
                sessionStorage.setItem('truputUnlocked', 'true');
                navigateToTruput();
                toast('🔓 Access granted!', 'success');
                passwordAttempts = 0;
            } else {
                passwordAttempts++;
                var remaining = maxAttempts - passwordAttempts;
                if (remaining <= 0) {
                    errorEl.textContent = '❌ Too many attempts! Reload the page to try again.';
                    document.getElementById('passwordInput').disabled = true;
                    setTimeout(function() {
                        document.getElementById('passwordInput').disabled = false;
                        passwordAttempts = 0;
                        errorEl.textContent = '';
                        document.getElementById('passwordInput').value = '';
                    }, 30000);
                } else {
                    errorEl.textContent = '❌ Wrong password. ' + remaining + ' attempt(s) remaining.';
                    document.getElementById('passwordInput').value = '';
                    document.getElementById('passwordInput').focus();
                }
            }
        }

        // ── Navigate to Truput ──
        function navigateToTruput() {
            document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
            var pg = document.getElementById('page-truput');
            if (pg) pg.classList.add('active');
            currentPage = 'truput';
            
            document.querySelectorAll('.nav-item').forEach(function(n) { n.classList.remove('active'); });
            var ni = document.getElementById('snav-truput');
            if (ni) ni.classList.add('active');
            
            document.querySelectorAll('.bnav-item').forEach(function(n) { n.classList.remove('active'); });
            var bi = document.getElementById('bnav-truput');
            if (bi) bi.classList.add('active');
            
            var tt = document.getElementById('page-title');
            if (tt) tt.textContent = 'Truput';
            
            var iframe = document.getElementById('truputIframe');
            if (iframe) iframe.src = iframe.src;
            
            setProgress(100);
            setTimeout(function(){ setProgress(0); }, 300);
        }

        // ── Toast notification ──
        var toastTimer = null;
        function toast(msg, type) {
            var el = document.getElementById('toast');
            if (!el) return;
            el.textContent = msg;
            el.className = 'show ' + (type || 'info');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(function() { el.className = ''; }, 3000);
        }

        // ── Top progress bar ──
        function setProgress(val) {
            var el = document.getElementById('top-progress-bar');
            if (!el) return;
            if (val === 0) { el.style.opacity='1'; el.style.width='0%'; }
            else if (val >= 100) { el.style.width='100%'; setTimeout(function(){ el.style.opacity='0'; },300); }
            else { el.style.width = val + '%'; }
        }

        // ── Page navigation ──
        var currentPage = 'home';
        function navigate(name) {
            if (name === 'upload') {
                // Load upload in iframe
                var iframe = document.getElementById('uploadIframe');
                if (iframe) {
                    iframe.src = 'https://mushroom-levitate-sandbag.ngrok-free.dev';
                }
            }
            
            if (name === 'truput') {
                if (sessionStorage.getItem('truputUnlocked') === 'true') {
                    navigateToTruput();
                    return;
                }
                openPasswordModal();
                return;
            }
            
            document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
            var pg = document.getElementById('page-' + name);
            if (pg) pg.classList.add('active');
            currentPage = name;
            
            document.querySelectorAll('.nav-item').forEach(function(n) { n.classList.remove('active'); });
            var ni = document.getElementById('snav-' + name);
            if (ni) ni.classList.add('active');
            
            document.querySelectorAll('.bnav-item').forEach(function(n) { n.classList.remove('active'); });
            var bi = document.getElementById('bnav-' + name);
            if (bi) bi.classList.add('active');
            
            var titles = {
                home: 'Home',
                foam: 'Foam',
                gasket: 'Gasket',
                calculator: 'Calculator',
                truput: 'Truput',
                upload: 'Door Upload'
            };
            var tt = document.getElementById('page-title');
            if (tt) tt.textContent = titles[name] || name;
            
            // Reload iframes when navigating to them
            if (name === 'foam') {
                var iframe = document.getElementById('foamIframe');
                if (iframe) iframe.src = iframe.src;
            }
            if (name === 'gasket') {
                var iframe = document.getElementById('gasketIframe');
                if (iframe) iframe.src = iframe.src;
            }
            if (name === 'calculator') {
                var iframe = document.getElementById('calculatorIframe');
                if (iframe) iframe.src = iframe.src;
            }
            
            setProgress(100);
            setTimeout(function(){ setProgress(0); }, 300);
        }

        // ── Refresh ──
        function refreshAll() {
            setProgress(30);
            setTimeout(function() { setProgress(70); }, 200);
            setTimeout(function() {
                // Reload current iframe
                var currentIframe = document.querySelector('.page.active .page-iframe');
                if (currentIframe) {
                    currentIframe.src = currentIframe.src;
                }
                setProgress(100);
                toast('🔄 Refreshed', 'success');
            }, 500);
        }

        // ── Theme switching ──
        var THEMES = {
            navy:   { '--primary':'#4f6ef7', '--primary-dark':'#3a56e4', '--secondary':'#2dd4bf', '--bg':'radial-gradient(ellipse at top left, #121c38, #050811)', '--text':'#eef2ff', '--text-2':'#94a3b8' },
            purple: { '--primary':'#9333ea', '--primary-dark':'#7e22ce', '--secondary':'#ec4899', '--bg':'radial-gradient(circle at top right, #2a1147, #0b0512)', '--text':'#f3e8ff', '--text-2':'#c084fc' },
            ocean:  { '--primary':'#0ea5e9', '--primary-dark':'#0284c7', '--secondary':'#14b8a6', '--bg':'radial-gradient(circle at bottom left, #0b2f44, #020d18)', '--text':'#f0f9ff', '--text-2':'#7dd3fc' },
            slate:  { '--primary':'#94a3b8', '--primary-dark':'#64748b', '--secondary':'#cbd5e1', '--bg':'radial-gradient(circle at center, #1e293b, #0f172a)', '--text':'#f8fafc', '--text-2':'#cbd5e1' },
            amoled: { '--primary':'#ffffff', '--primary-dark':'#e2e8f0', '--secondary':'#94a3b8', '--bg':'#000000', '--text':'#ffffff', '--text-2':'#94a3b8' },
            cyberpunk: { '--primary':'#f43f5e', '--primary-dark':'#e11d48', '--secondary':'#0ea5e9', '--bg':'radial-gradient(circle at center, #2e0821, #0a0108)', '--text':'#ffffff', '--text-2':'#fda4af' }
        };
        var themeNames = Object.keys(THEMES);
        var currentIndex = 0;

        function applyTheme(name) {
            var t = THEMES[name] || THEMES.navy;
            var root = document.documentElement;
            Object.keys(t).forEach(function(k) { root.style.setProperty(k, t[k]); });
            var label = document.getElementById('themeLabel');
            if (label) label.textContent = name;
            localStorage.setItem('theme', name);
            toast('🎨 Theme: ' + name, 'info');
        }

        var toggle = document.getElementById('themeToggle');
        if (toggle) {
            toggle.addEventListener('click', function() {
                currentIndex = (currentIndex + 1) % themeNames.length;
                applyTheme(themeNames[currentIndex]);
            });
        }

        // ── On load ──
        window.addEventListener('DOMContentLoaded', function() {
            var savedTheme = localStorage.getItem('theme');
            if (savedTheme) applyTheme(savedTheme);
            else applyTheme('navy');
            
            var hash = window.location.hash.replace('#', '');
            if (hash && ['home','foam','gasket','calculator','truput','upload'].includes(hash)) {
                if (hash === 'truput' && sessionStorage.getItem('truputUnlocked') !== 'true') {
                    openPasswordModal();
                } else {
                    navigate(hash);
                }
            } else {
                navigate('home');
            }
            
            setProgress(100);
            setTimeout(function(){ setProgress(0); }, 400);
        });

        // ── Enter key on password input ──
        document.getElementById('passwordInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                checkPassword();
            }
        });

        // ── Close modal when clicking outside ──
        document.getElementById('passwordOverlay').addEventListener('click', function(e) {
            if (e.target === this) {
                closePasswordModal();
            }
        });
    </script>

</body>
</html>
